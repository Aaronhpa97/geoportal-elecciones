<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de rutas por velocidad</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }

        .panel {
            position: absolute; top: 20px; right: 20px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3); font-size: 13px; width: 320px;
        }
        .panel h4 { margin: 0 0 10px; font-size: 14px; }
        .fila-vel { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .fila-vel input { width: 60px; padding: 3px 5px; border: 1px solid #ccc; border-radius: 4px; text-align: right; }
        .fila-vel .grupo { display: flex; gap: 4px; }
        .leyenda-inputs { font-size: 11px; color: #666; margin-top: 4px; display: flex; justify-content: space-between; padding: 0 4px; }

        .btn-calcular {
            width: 100%; margin-top: 10px; padding: 8px;
            background: #2E86C1; color: white; border: none; border-radius: 4px;
            cursor: pointer; font-weight: bold;
        }
        .btn-calcular:hover { background: #2471A3; }
        .btn-calcular:disabled { background: #95a5a6; cursor: not-allowed; }

        #resultados { margin-top: 12px; border-top: 1px solid #eee; padding-top: 10px; }
        .fila-resultado { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; }
        .muestra-color { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
        .fila-resultado .nombre { flex: 1; font-weight: bold; }
        .fila-resultado .datos { text-align: right; color: #555; }
        .mensaje { color: #888; font-size: 12px; text-align: center; padding: 8px 0; }
        .fila-busqueda { position: relative; margin-bottom: 10px; }
        .fila-busqueda label { font-weight: bold; font-size: 12px; display: block; margin-bottom: 3px; }
        .fila-busqueda input {
            width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px;
            box-sizing: border-box; font-size: 13px;
        }
        .sugerencias {
            position: absolute; top: 100%; left: 0; right: 0; z-index: 1100;
            background: white; border: 1px solid #ccc; border-top: none;
            border-radius: 0 0 4px 4px; max-height: 180px; overflow-y: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: none;
        }
        .sugerencias .item {
            padding: 6px 8px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #f0f0f0;
        }
        .sugerencias .item:hover { background-color: #e0f2ff; }
    </style>
</head>
<body>

<div id="map"></div>
<a href="index.html" style="position:absolute; top:20px; left:20px; z-index:1000;
   background:white; padding:8px 14px; border-radius:6px;
   box-shadow:0 2px 8px rgba(0,0,0,0.3); text-decoration:none;
   font-weight:bold; color:#333; font-size:13px;">← Volver al mapa</a>

<div class="panel">
    <h4>🚗 Comparador de rutas</h4>
    <div class="fila-busqueda">
        <label for="input-origen">Origen:</label>
        <input type="text" id="input-origen" placeholder="Ej: Puerta del Sol, Madrid" autocomplete="off">
        <div id="sugerencias-origen" class="sugerencias"></div>
    </div>
    <div class="fila-busqueda">
        <label for="input-destino">Destino:</label>
        <input type="text" id="input-destino" placeholder="Ej: Sagrada Familia, Barcelona" autocomplete="off">
        <div id="sugerencias-destino" class="sugerencias"></div>
    </div>
    <hr style="border:none; border-top:1px solid #eee; margin:10px 0;">
    <div class="fila-vel">
        <span>Autovía (km/h)</span>
        <div class="grupo">
            <input type="number" id="eco-motorway" value="100" title="Eco">
            <input type="number" id="fast-motorway" value="140" title="Rápida">
        </div>
    </div>
    <div class="fila-vel">
        <span>Nacional (km/h)</span>
        <div class="grupo">
            <input type="number" id="eco-trunk" value="80" title="Eco">
            <input type="number" id="fast-trunk" value="100" title="Rápida">
        </div>
    </div>
    <div class="leyenda-inputs">
        <span>← Bajo consumo</span>
        <span>Alta velocidad →</span>
    </div>
    <button class="btn-calcular" id="btn-calcular" onclick="calcularYComparar()">🔄 Calcular y comparar</button>
    <div id="resultados"><div class="mensaje">Pulsa "Calcular y comparar"</div></div>
</div>

<script>
// ============================================================
// CONFIGURACIÓN
// ============================================================
const GH_API_KEY = '4a390548-61d4-43d0-ad3b-2cb729210cb5';
const ORIGEN  = { lat: 40.4168, lng: -3.7038 };  // Madrid
const DESTINO = { lat: 41.3874, lng: 2.1686 };   // Barcelona

// Objeto para guardar los puntos seleccionados por el usuario
const puntosSeleccionados = {
    origen: null,   // { lat, lng, label }
    destino: null
};

// ============================================================
// MAPA Y PANES (z-index fijo)
// ============================================================
var map = L.map('map').setView([40.9, -1.5], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

// Tres panes con z-index creciente: pane-slow < pane-mid < pane-fast
['slow', 'mid', 'fast'].forEach((nombre, i) => {
    const pane = map.createPane('pane-' + nombre);
    pane.style.zIndex = 410 + i * 10;
});

window.marcadorOrigen  = L.marker([ORIGEN.lat, ORIGEN.lng]).addTo(map).bindPopup('Origen');
window.marcadorDestino = L.marker([DESTINO.lat, DESTINO.lng]).addTo(map).bindPopup('Destino');

let capasActuales = [];

// ============================================================
// UTILIDADES
// ============================================================
function construirCustomModel(velocidades) {
    if (!velocidades || Object.keys(velocidades).length === 0) return null;
    const speed = [];
    if (velocidades.motorway) speed.push({ if: 'road_class == MOTORWAY', limit_to: velocidades.motorway });
    if (velocidades.trunk)    speed.push({ if: 'road_class == TRUNK',    limit_to: velocidades.trunk });
    return { speed };
}

function formatearTiempo(segundos) {
    const h = Math.floor(segundos / 3600);
    const m = Math.round((segundos % 3600) / 60);
    return h > 0 ? `${h}h ${m}min` : `${m}min`;
}

function limpiarRutas() {
    capasActuales.forEach(capa => map.removeLayer(capa));
    capasActuales = [];
}

// ============================================================
// PETICIÓN A GRAPHHOPPER
// ============================================================
async function calcularRuta(escenario) {
    const origen = puntosSeleccionados.origen;
    const destino = puntosSeleccionados.destino;
    if (!origen || !destino) throw new Error('Origen y destino no seleccionados');

    const body = {
        points: [
            [origen.lng, origen.lat],
            [destino.lng, destino.lat]
        ],
        profile: 'car',
        points_encoded: false,
        locale: 'es'
    };

    const customModel = construirCustomModel(escenario.velocidades);
    if (customModel) {
        body['ch.disable'] = true;          // OBLIGATORIO para custom_model
        body['custom_model'] = customModel;
    }

    const url = `https://graphhopper.com/api/1/route?key=${GH_API_KEY}`;

    const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });

    if (!resp.ok) {
        // Intentamos leer el mensaje de error que devuelve GraphHopper
        let detalle = '';
        try {
            const errJson = await resp.json();
            detalle = errJson.message || JSON.stringify(errJson);
        } catch (_) {}
        throw new Error(`HTTP ${resp.status} (${escenario.nombre})${detalle ? ': ' + detalle : ''}`);
    }

    const data = await resp.json();
    if (!data.paths || !data.paths[0]) {
        throw new Error(`Sin ruta (${escenario.nombre})`);
    }

    return { ...escenario, ruta: data.paths[0] };
}

// ============================================================
// CÁLCULO Y DIBUJO
// ============================================================
async function calcularYComparar() {
    const btn = document.getElementById('btn-calcular');
    const divRes = document.getElementById('resultados');

    // --- NUEVO: Validar que se han seleccionado origen y destino ---
    if (!puntosSeleccionados.origen || !puntosSeleccionados.destino) {
        divRes.innerHTML = '<div class="mensaje" style="color:#C0392B;">❌ Selecciona un origen y un destino de las sugerencias.</div>';
        return;
    }
    btn.disabled = true;
    btn.textContent = '⏳ Calculando...';

    // --- NUEVO: Actualizar las coordenadas globales con las seleccionadas ---
    const origenActual = puntosSeleccionados.origen;
    const destinoActual = puntosSeleccionados.destino;

    // Actualizar los marcadores en el mapa
    if (window.marcadorOrigen) map.removeLayer(window.marcadorOrigen);
    if (window.marcadorDestino) map.removeLayer(window.marcadorDestino);
    window.marcadorOrigen = L.marker([origenActual.lat, origenActual.lng]).addTo(map).bindPopup('Origen: ' + origenActual.label).openPopup();
    window.marcadorDestino = L.marker([destinoActual.lat, destinoActual.lng]).addTo(map).bindPopup('Destino: ' + destinoActual.label).openPopup();

    const escenarios = [
        {
            id: 'eco', nombre: 'Bajo consumo', color: '#27AE60',
            velocidades: {
                motorway: parseFloat(document.getElementById('eco-motorway').value) || 100,
                trunk:    parseFloat(document.getElementById('eco-trunk').value)    || 80
            }
        },
        {
            id: 'normal', nombre: 'Normal', color: '#F1C40F',
            velocidades: {}  // sin custom_model → velocidades por defecto de GraphHopper
        },
        {
            id: 'rapida', nombre: 'Alta velocidad', color: '#E31C1C',
            velocidades: {
                motorway: parseFloat(document.getElementById('fast-motorway').value) || 140,
                trunk:    parseFloat(document.getElementById('fast-trunk').value)    || 100
            }
        }
    ];

    try {
        // 3 peticiones en paralelo (3 créditos)
        limpiarRutas();
        const resultados = await Promise.all(escenarios.map(calcularRuta));

        // Asignación de panes por duración: la más lenta al pane más bajo,
        // la más rápida al más alto. Así siempre queda arriba, sin importar
        // qué escenario haya resultado ganador.
        const ordenPorDuracion = [...resultados].sort((a, b) => b.ruta.time - a.ruta.time);
        const paneNames = ['pane-slow', 'pane-mid', 'pane-fast'];
        ordenPorDuracion.forEach((r, idx) => { r.paneName = paneNames[idx]; });

        // Dibujo
        resultados.forEach(r => {
            const coords = r.ruta.points.coordinates.map(c => [c[1], c[0]]); // GeoJSON: [lng, lat]
            const linea = L.polyline(coords, {
                pane: r.paneName,
                color: r.color,
                weight: 6,
                opacity: 0.85
            }).addTo(map);

            linea.bindPopup(
                `<b>${r.nombre}</b><br>` +
                `Distancia: ${(r.ruta.distance / 1000).toFixed(1)} km<br>` +
                `Tiempo: ${formatearTiempo(r.ruta.time)}`
            );
            capasActuales.push(linea);
        });

        // Panel resumen (más rápida arriba)
        const ordenados = [...resultados].sort((a, b) => a.ruta.time - b.ruta.time);
        let html = '';
        ordenados.forEach((r, i) => {
            html += `<div class="fila-resultado">
                <span class="muestra-color" style="background:${r.color};"></span>
                <span class="nombre">${i === 0 ? '🏆 ' : ''}${r.nombre}</span>
                <span class="datos">${(r.ruta.distance / 1000).toFixed(0)} km · ${formatearTiempo(r.ruta.time)}</span>
            </div>`;
        });
        divRes.innerHTML = html;

        // Ajustar zoom para ver las tres rutas
        const todasCoords = resultados.flatMap(r =>
            r.ruta.points.coordinates.map(c => [c[1], c[0]])
        );
        map.fitBounds(L.latLngBounds(todasCoords), { padding: [40, 40] });

    } catch (err) {
        console.error(err);
        divRes.innerHTML = `<div class="mensaje" style="color:#C0392B;">❌ ${err.message}</div>`;
    } finally {
        btn.disabled = false;
        btn.textContent = '🔄 Calcular y comparar';
    }
}


// Función genérica para buscar direcciones en CartoCiudad
async function buscarDireccionCartoCiudad(texto) {
    if (!texto || texto.length < 3) return [];
    const url = `https://www.cartociudad.es/geocoder/api/geocoder/candidatesJsonp?q=${encodeURIComponent(texto)}&limit=5`;
    try {
        const resp = await fetch(url);
        // CartoCiudad devuelve 204 (sin contenido) si no hay resultados, lo cual no es un error.
        if (resp.status === 204) return [];
        if (!resp.ok) throw new Error('Error en la búsqueda');
        const data = await resp.json();
        // La API devuelve un array de candidatos.
        return data.map(item => ({
            label: item.address || item.muni || 'Dirección desconocida',
            lat: parseFloat(item.lat),
            lng: parseFloat(item.lng)
        })).filter(p => !isNaN(p.lat) && !isNaN(p.lng));
    } catch (e) {
        console.error("Error buscando en CartoCiudad:", e);
        return [];
    }
}

// Configurar un campo de entrada con autocompletado
function configurarBuscador(idInput, idSugerencias, clavePunto) {
    const input = document.getElementById(idInput);
    const divSugerencias = document.getElementById(idSugerencias);
    let timeoutId = null;

    input.addEventListener('input', () => {
        clearTimeout(timeoutId);
        const texto = input.value.trim();
        if (texto.length < 3) {
            divSugerencias.style.display = 'none';
            return;
        }
        // Debounce para no saturar la API en cada pulsación
        timeoutId = setTimeout(async () => {
            const resultados = await buscarDireccionCartoCiudad(texto);
            divSugerencias.innerHTML = '';
            if (resultados.length === 0) {
                divSugerencias.style.display = 'none';
                return;
            }
            resultados.forEach(res => {
                const item = document.createElement('div');
                item.className = 'item';
                item.textContent = res.label;
                item.addEventListener('click', () => {
                    input.value = res.label;
                    puntosSeleccionados[clavePunto] = res;
                    divSugerencias.style.display = 'none';
                });
                divSugerencias.appendChild(item);
            });
            divSugerencias.style.display = 'block';
        }, 300); // 300 ms de espera
    });

    // Ocultar sugerencias al hacer clic fuera
    document.addEventListener('click', (e) => {
        if (!input.contains(e.target) && !divSugerencias.contains(e.target)) {
            divSugerencias.style.display = 'none';
        }
    });
}

// Inicializar los dos buscadores
configurarBuscador('input-origen', 'sugerencias-origen', 'origen');
configurarBuscador('input-destino', 'sugerencias-destino', 'destino');
</script>

</body>
</html>
