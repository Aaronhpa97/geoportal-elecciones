<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoportal Electoral España</title>
    <!-- Cargar Leaflet desde CDN (gratis) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }

        .info {
            padding: 6px 8px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
        .info h4 { margin: 0 0 5px; color: #333; font-size: 14px; }

        /* Panel de herramientas */
        .panel-herramientas {
            position: relative;
            font-family: Arial, sans-serif;
        }
        .btn-toggle-herramientas {
            background: white;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .btn-toggle-herramientas:hover { background: #f0f0f0; }
        .btn-toggle-herramientas.activo { background: #e0e7ff; }

        .contenido-herramientas {
            position: absolute;
            top: 52px;
            right: 0;
            width: 340px;
            max-height: 550px;
            overflow-y: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            padding: 12px;
            font-size: 13px;
            z-index: 1000;
        }
        .contenido-herramientas h4 {
            margin: 0 0 8px 0;
            color: #333;
            font-size: 14px;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }
        .btn-accion {
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
            margin-top: 8px;
        }
        .btn-accion:hover { 
            background: #e5e5e5; 
        }
        .btn-navegacion {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 8px 10px;
            margin-top: 12px;
            background: linear-gradient(135deg, #2E86C1, #2471A3);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-navegacion:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(46, 134, 193, 0.4);
        }
        .btn-navegacion:active {
            transform: translateY(0);
        }

        .fila-partido {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 0;
            font-size: 12px;
        }
        .muestra-color {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin-right: 6px;
            border-radius: 2px;
            vertical-align: middle;
        }
        .lista-municipios {
            max-height: 120px;
            overflow-y: auto;
            font-size: 12px;
            padding: 4px 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // ============================================================
        // ESTADO GLOBAL
        // ============================================================
        let municipiosSeleccionados = {};   // { codigo: { votos: {partido: n}, ganador: str } }
        let capasMunicipios = {};          // { codigo: { layer, feature } }

        // ============================================================
        // MAPA BASE
        // ============================================================
        var map = L.map('map').setView([40.4168, -3.7038], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // ============================================================
        // COLORES
        // ============================================================
        function getColor(partido) {
            if (!partido) return '#cccccc';
            const p = partido.toUpperCase();

            if (p.includes('PSOE') || p.includes('PSC') || p.includes('PSDEG')) return '#E31C1C';
            if (p === 'PP' || p.includes('PARTIDO POPULAR')) return '#2E86C1';
            if (p.includes('VOX')) return '#27AE60';
            if (p.includes('SUMAR') || p.includes('PODEMOS')) return '#8E44AD';
            if (p.includes('ERC') || p.includes('ESQUERRA')) return '#C8102E';
            if (p.includes('JUNTS')) return '#FDB612';
            if (p.includes('BILDU')) return '#00D0B6';
            if (p.includes('PNV') || p.includes('EAJ')) return '#2E7D32';
            if (p.includes('BNG')) return '#751069';
            if (p === 'OTROS') return '#95A5A6';

            // Color determinístico para cualquier otro partido que haya ganado
            let hash = 0;
            for (let i = 0; i < p.length; i++) {
                hash = p.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash) % 360;
            return `hsl(${hue}, 65%, 50%)`;
        }

        // ============================================================
        // ESTILO
        // ============================================================
        function estiloOriginal(feature) {
            return {
                fillColor: getColor(feature.properties.partido_ganador),
                weight: 1,
                opacity: 1,
                color: 'white',
                fillOpacity: 0.7
            };
        }

        function estiloSeleccionado() {
            return {
                weight: 3,
                color: '#000000',
                fillOpacity: 0.95
            };
        }

        // ============================================================
        // LEYENDA
        // ============================================================
        var leyenda = L.control({position: 'bottomright'});
        leyenda.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info');
            var partidos = [
                {n: 'PSOE', c: '#E31C1C'}, {n: 'PP', c: '#2E86C1'},
                {n: 'Vox', c: '#27AE60'}, {n: 'Sumar/Podemos', c: '#8E44AD'},
                {n: 'ERC', c: '#C8102E'}, {n: 'Junts', c: '#FDB612'},
                {n: 'EH Bildu', c: '#00D0B6'}, {n: 'PNV', c: '#2E7D32'},
                {n: 'BNG', c: '#751069'}, {n: 'Otros', c: '#95A5A6'}
            ];
            var html = '<h4>Partido ganador</h4>';
            partidos.forEach(function (p) {
                html += `<i style="background:${p.c}; width:12px; height:12px; display:inline-block; margin-right:5px; border-radius:2px;"></i>${p.n}<br>`;
            });
            div.innerHTML = html;
            return div;
        };
        leyenda.addTo(map);

        // ============================================================
        // PANEL DE HERRAMIENTAS (colapsable)
        // ============================================================
        var panelHerramientas = L.control({position: 'topright'});
        panelHerramientas.onAdd = function () {
            var div = L.DomUtil.create('div', 'panel-herramientas');
            div.innerHTML = `
                <button id="btn-toggle-herramientas" class="btn-toggle-herramientas" title="Herramientas">⚙️</button>
                <div id="contenido-herramientas" class="contenido-herramientas" style="display:none;">
                    <h4>📊 Suma de municipios</h4>
                    <div id="lista-seleccionados" class="lista-municipios">
                        <p style="color:#888; margin:0;">Haz clic en los municipios del mapa para seleccionarlos.</p>
                    </div>
                    <hr style="border:none; border-top:1px solid #eee; margin:8px 0;">
                    <div id="suma-por-partido"></div>
                    <button id="btn-limpiar" class="btn-accion">🗑️ Limpiar selección</button>
                    <a href="routing.html" class="btn-navegacion">🧭 Comparar rutas</a>
                </div>
            `;

            // Evitar que los clics del panel lleguen al mapa
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);

            // Toggle del desplegable
            var btnToggle = div.querySelector('#btn-toggle-herramientas');
            var contenido = div.querySelector('#contenido-herramientas');
            L.DomEvent.on(btnToggle, 'click', function (e) {
                L.DomEvent.stop(e);
                var abierto = contenido.style.display !== 'none';
                contenido.style.display = abierto ? 'none' : 'block';
                btnToggle.classList.toggle('activo', !abierto);
            });

            // Botón limpiar
            var btnLimpiar = div.querySelector('#btn-limpiar');
            L.DomEvent.on(btnLimpiar, 'click', function (e) {
                L.DomEvent.stop(e);
                limpiarSeleccion();
            });

            return div;
        };
        panelHerramientas.addTo(map);

        // ============================================================
        // ACTUALIZACIÓN DEL PANEL
        // ============================================================
        function actualizarPanel() {
            const listaDiv = document.getElementById('lista-seleccionados');
            const sumaDiv = document.getElementById('suma-por-partido');
            if (!listaDiv || !sumaDiv) return;

            const codigos = Object.keys(municipiosSeleccionados);

            // --- Lista de municipios ---
            if (codigos.length === 0) {
                listaDiv.innerHTML = '<p style="color:#888; margin:0;">Haz clic en los municipios del mapa para seleccionarlos.</p>';
                sumaDiv.innerHTML = '';
                return;
            }

            let htmlLista = `<b>Municipios (${codigos.length}):</b><br>`;
            codigos.forEach(c => {
                const m = municipiosSeleccionados[c];
                htmlLista += `<div style="padding:1px 0;">· ${c} <span style="color:#666">(${m.ganador})</span></div>`;
            });
            listaDiv.innerHTML = htmlLista;

            // --- Suma por partido ---
            const sumas = {};
            codigos.forEach(c => {
                const votos = municipiosSeleccionados[c].votos;
                for (const partido in votos) {
                    sumas[partido] = (sumas[partido] || 0) + votos[partido];
                }
            });

            const entradas = Object.entries(sumas)
                .filter(([, v]) => v > 0)
                .sort((a, b) => b[1] - a[1]);

            const total = entradas.reduce((acc, [, v]) => acc + v, 0);

            let htmlSuma = '<b>Votos por partido:</b>';
            entradas.forEach(([partido, votos]) => {
                const pct = total > 0 ? ((votos / total) * 100).toFixed(1) : '0.0';
                const color = getColor(partido);
                htmlSuma += `
                    <div class="fila-partido">
                        <span><i class="muestra-color" style="background:${color};"></i>${partido}</span>
                        <span><b>${votos.toLocaleString('es-ES')}</b> <span style="color:#888">(${pct}%)</span></span>
                    </div>`;
            });
            htmlSuma += `
                <hr style="border:none; border-top:1px solid #ccc; margin:8px 0;">
                <div class="fila-partido" style="font-weight:bold;">
                    <span>TOTAL</span>
                    <span>${total.toLocaleString('es-ES')}</span>
                </div>`;
            sumaDiv.innerHTML = htmlSuma;
        }

        // ============================================================
        // LIMPIAR SELECCIÓN
        // ============================================================
        function limpiarSeleccion() {
            Object.values(capasMunicipios).forEach(({ layer, feature }) => {
                layer.setStyle(estiloOriginal(feature));
            });
            municipiosSeleccionados = {};
            actualizarPanel();
        }

        // ============================================================
        // GESTIÓN DE CADA MUNICIPIO
        // ============================================================
        function onEachFeature(feature, layer) {
            const props = feature.properties;
            const codigo = props.codigo_municipio;

            // Extraer dinámicamente todas las propiedades votos_*
            const votosPorPartido = {};
            for (const key in props) {
                if (key.startsWith('votos_') && key !== 'votos_ganador') {
                    const partido = key.replace('votos_', '');
                    const n = Number(props[key]) || 0;
                    votosPorPartido[partido] = n;
                }
            }

            // Popup
            if (props.partido_ganador) {
                let popupHtml = `<b>Municipio: </b>${codigo}<br>
                                <b>Ganador: </b>${props.partido_ganador}<br>
                                <b>Votos ganador: </b>${Number(props.votos_ganador || 0).toLocaleString('es-ES')}`;
                layer.bindPopup(popupHtml);
            }

            capasMunicipios[codigo] = { layer, feature };

            layer.on('click', function (e) {
                L.DomEvent.stopPropagation(e);

                if (municipiosSeleccionados[codigo]) {
                    // Deseleccionar
                    delete municipiosSeleccionados[codigo];
                    layer.setStyle(estiloOriginal(feature));
                } else {
                    // Seleccionar
                    municipiosSeleccionados[codigo] = {
                        votos: votosPorPartido,
                        ganador: props.partido_ganador || 'Sin datos'
                    };
                    layer.setStyle(estiloSeleccionado());
                    layer.bringToFront();
                }
                actualizarPanel();
            });
        }

        // ============================================================
        // CARGA DEL GEOJSON
        // ============================================================
        fetch('mapa.geojson')
            .then(r => r.json())
            .then(data => {
                L.geoJSON(data, {
                    style: estiloOriginal,
                    onEachFeature: onEachFeature
                }).addTo(map);
            })
            .catch(err => console.error('Error cargando el mapa:', err));
    </script>
</body>
</html>
