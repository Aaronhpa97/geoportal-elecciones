<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoportal Electoral España</title>
    <!-- Cargar Leaflet desde CDN (gratis) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .info { padding: 6px 8px; font: 14px/16px Arial, Helvetica, sans-serif; background: white; background: rgba(255,255,255,0.8); box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 5px; }
        .info h4 { margin: 0 0 5px; color: #777; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Inicializar el mapa centrado en España
        var map = L.map('map').setView([40.4168, -3.7038], 6);

        // Añadir capa base (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Leyenda de partidos
        var legend = L.control({position: 'bottomright'});

        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');
            var partidos = [
                {nombre: 'PSOE', color: '#E31C1C'},
                {nombre: 'PP', color: '#2E86C1'},
                {nombre: 'Vox', color: '#27AE60'},
                {nombre: 'Sumar/Podemos', color: '#8E44AD'},
                {nombre: 'ERC', color: '#fcf40d'},
                {nombre: 'Junts', color: '#FDB612'},
                {nombre: 'EH Bildu', color: '#00D0B6'},
                {nombre: 'PNV', color: '#2E7D32'},
                {nombre: 'BNG', color: '#A2C7E4'},
                {nombre: 'Otros', color: '#7f8a81'}
            ];
            var html = '<h4>Partido ganador</h4>';
            partidos.forEach(function(p) {
                html += '<i style="background:' + p.color + '; width:12px; height:12px; display:inline-block; margin-right:5px;"></i> ' + p.nombre + '<br>';
            });
            div.innerHTML = html;
            return div;
        };
        legend.addTo(map);

        //Selección
        let municipiosSeleccionados = []; // Guarda los objetos {nombre, votos, partido}
        let capasMunicipios = {}; // Referencia a cada capa por su código, para cambiar el estilo
        
        var panelSuma = L.control({position: 'topright'});

        panelSuma.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info');
            div.id = 'panel-suma';
            div.innerHTML = '<h4>Suma de municipios</h4><p>Haz clic en los municipios para seleccionarlos.</p><div id="lista-seleccionados"></div><hr><b>Total votos ganador: <span id="total-votos">0</span></b>';
            return div;
        };
        panelSuma.addTo(map);

        // Cargar el GeoJSON con los resultados
        fetch('mapa.geojson')
            .then(response => response.json())
            .then(data => {
                // Función para asignar color según el partido ganador
                function getColor(partido) {
                    if (!partido) return '#cccccc'; // gris si no hay datos

                    const p = partido.toUpperCase();

                    if (p.includes('PP') || p.includes('POPULAR')) return '#2E86C1'; // azul
                    if (p.includes('PSOE') || p.includes('PSC') || p.includes('PSdeG') || p.includes('SOCIALISTA')) return '#E74C3C'; // rojo
                    if (p.includes('VOX')) return '#27AE60'; // verde
                    if (p.includes('SUMAR') || p.includes('PODEMOS') || p.includes('UNIDAS PODEMOS') || p.includes('COMPROMIS')) return '#8E44AD'; // morado
                    if (p.includes('ERC') || p.includes('ESQUERRA REPUBLICANA')) return '#fcf40d';
                    if (p.includes('JUNTS')) return '#FDB612';
                    if (p.includes('BILDU') || p.includes('EH BILDU')) return '#00D0B6';
                    if (p.includes('PNV') || p.includes('EAJ-PNV')) return '#2E7D32';
                    if (p.includes('BNG') || p.includes('BLOQUE NACIONALISTA')) return '#A2C7E4';
                    return '#7f8a81'; // amarillo para otros
                }

                // Estilo de cada municipio
                function style(feature) {
                    return {
                        fillColor: getColor(feature.properties.partido_ganador),
                        weight: 1,
                        opacity: 1,
                        color: 'white',
                        fillOpacity: 0.7
                    };
                }

                // Popup al hacer clic
                function onEachFeature(feature, layer) {
                    if (feature.properties && feature.properties.partido_ganador) {
                        layer.bindPopup(
                            '<b>Municipio: </b>' + feature.properties.codigo_municipio + '<br>' +
                            '<b>Ganador: </b>' + feature.properties.partido_ganador + '<br>' +
                            '<b>Votos: </b>' + feature.properties.votos_ganador
                        );
                    }
                    // Guardamos la capa para poder cambiar su estilo luego
                    const codigo = feature.properties.codigo_municipio;
                    capasMunicipios[codigo] = layer;

                    // Evento de clic para seleccionar/deseleccionar
                    layer.on('click', function (e) {
                        L.DomEvent.stopPropagation(e); // Evita que el clic se propague al mapa

                        const index = municipiosSeleccionados.findIndex(m => m.codigo === codigo);

                        if (index === -1) {
                            // --- SELECCIONAR ---
                            municipiosSeleccionados.push({
                                codigo: codigo,
                                votos: feature.properties.votos_ganador || 0,
                                partido: feature.properties.partido_ganador || 'Sin datos'
                            });

                            // Estilo visual: borde más grueso y oscuro
                            layer.setStyle({
                                weight: 3,
                                color: '#000000',
                                dashArray: '',
                                fillOpacity: 0.9
                            });
                            layer.bringToFront();

                        } else {
                            // --- DESELECCIONAR ---
                            municipiosSeleccionados.splice(index, 1);

                            // Restaurar estilo original (el que definiste en la función `style`)
                            layer.setStyle(estiloOriginal(feature));
                        }

                        actualizarPanelSuma();
                    });
                }

                function estiloOriginal(feature) {
                    return {
                        fillColor: getColor(feature.properties.partido_ganador),
                        weight: 1,
                        opacity: 1,
                        color: 'white',
                        fillOpacity: 0.7
                    };
                }

                function actualizarPanelSuma() {
                    const listaDiv = document.getElementById('lista-seleccionados');
                    const totalSpan = document.getElementById('total-votos');

                    if (!listaDiv || !totalSpan) return; // Por si el panel no está listo

                    // Limpiar lista
                    listaDiv.innerHTML = '';

                    let totalVotos = 0;

                    municipiosSeleccionados.forEach(m => {
                        totalVotos += m.votos;
                        const item = document.createElement('div');
                        item.style.marginBottom = '4px';
                        item.innerHTML = `· ${m.codigo}: <b>${m.partido}</b> (${m.votos} votos)`;
                        listaDiv.appendChild(item);
                    });

                    totalSpan.textContent = totalVotos.toLocaleString('es-ES');
                }

                // Añadir la capa GeoJSON al mapa
                L.geoJSON(data, {
                    style: estiloOriginal,
                    onEachFeature: onEachFeature
                }).addTo(map);
            })
            .catch(error => console.error('Error cargando el GeoJSON:', error));
    </script>
</body>
</html>
