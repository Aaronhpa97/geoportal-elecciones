<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoportal Electoral España</title>
    <!-- Cargar Leaflet desde CDN (gratis) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .info { padding: 6px 8px; font: 14px/16px Arial, Helvetica, sans-serif; background: white; background: rgba(255,255,255,0.8); box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 5px; }
        .info h4 { margin: 0 0 5px; color: #777; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // 1. Inicializar el mapa centrado en España
        var map = L.map('map').setView([40.4168, -3.7038], 6);

        // 2. Añadir capa base (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Leyenda de partidos
        var legend = L.control({position: 'bottomright'});

        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');
            var partidos = [
                {nombre: 'PSOE', color: '#E31C1C'},
                {nombre: 'PP', color: '#2E86C1'},
                {nombre: 'Vox', color: '#27AE60'},
                {nombre: 'Sumar/Podemos', color: '#8E44AD'},
                {nombre: 'ERC', color: '#fcf40d'},
                {nombre: 'Junts', color: '#FDB612'},
                {nombre: 'EH Bildu', color: '#00D0B6'},
                {nombre: 'PNV', color: '#2E7D32'},
                {nombre: 'BNG', color: '#A2C7E4'},
                {nombre: 'Otros', color: '#7f8a81'}
            ];
            var html = '<h4>Partido ganador</h4>';
            partidos.forEach(function(p) {
                html += '<i style="background:' + p.color + '; width:12px; height:12px; display:inline-block; margin-right:5px;"></i> ' + p.nombre + '<br>';
            });
            div.innerHTML = html;
            return div;
        };
        legend.addTo(map);

        // 3. Cargar el GeoJSON con los resultados
        fetch('mapa.geojson')
            .then(response => response.json())
            .then(data => {
                // Función para asignar color según el partido ganador
                function getColor(partido) {
                    if (!partido) return '#cccccc'; // gris si no hay datos

                    const p = partido.toUpperCase();

                    if (p.includes('PP') || p.includes('POPULAR')) return '#2E86C1'; // azul
                    if (p.includes('PSOE') || p.includes('PSC') || p.includes('PSdeG') || p.includes('SOCIALISTA')) return '#E74C3C'; // rojo
                    if (p.includes('VOX')) return '#27AE60'; // verde
                    if (p.includes('SUMAR') || p.includes('PODEMOS') || p.includes('UNIDAS PODEMOS') || p.includes('COMPROMIS')) return '#8E44AD'; // morado
                    if (p.includes('ERC') || p.includes('ESQUERRA REPUBLICANA')) return '#fcf40d';
                    if (p.includes('JUNTS')) return '#FDB612';
                    if (p.includes('BILDU') || p.includes('EH BILDU')) return '#00D0B6';
                    if (p.includes('PNV') || p.includes('EAJ-PNV')) return '#2E7D32';
                    if (p.includes('BNG') || p.includes('BLOQUE NACIONALISTA')) return '#A2C7E4';
                    return '#7f8a81'; // amarillo para otros
                }

                // Estilo de cada municipio
                function style(feature) {
                    return {
                        fillColor: getColor(feature.properties.partido_ganador),
                        weight: 1,
                        opacity: 1,
                        color: 'white',
                        fillOpacity: 0.7
                    };
                }

                // Popup al hacer clic
                function onEachFeature(feature, layer) {
                    if (feature.properties && feature.properties.partido_ganador) {
                        layer.bindPopup(
                            '<b>Municipio: </b>' + feature.properties.codigo_municipio + '<br>' +
                            '<b>Ganador: </b>' + feature.properties.partido_ganador + '<br>' +
                            '<b>Votos: </b>' + feature.properties.votos_ganador
                        );
                    }
                }

                // Añadir la capa GeoJSON al mapa
                L.geoJSON(data, {
                    style: style,
                    onEachFeature: onEachFeature
                }).addTo(map);
            })
            .catch(error => console.error('Error cargando el GeoJSON:', error));
    </script>
</body>
</html>
